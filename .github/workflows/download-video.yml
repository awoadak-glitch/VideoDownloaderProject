name: Video Downloader Pro (Anti-Block)

on:
  repository_dispatch:
    types: [download-command]

jobs:
  download_job:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq
          # تثبيت أحدث نسخة من المحرك لتجاوز التغييرات في المواقع
          pip install -U yt-dlp 

      - name: Download Processing
        run: |
          mkdir -p downloads
          URL="${{ github.event.client_payload.url }}"
          QUALITY="${{ github.event.client_payload.quality }}"
          
          # إعداد خيارات الجودة
          if [ "$QUALITY" == "mp3" ]; then
            FORMAT="-x --audio-format mp3"
            EXT="mp3"
          elif [ "$QUALITY" == "720" ]; then
            FORMAT="-f 'bestvideo[height<=720]+bestaudio/best'"
            EXT="mp4"
          else
            # الافتراضي: أفضل جودة
            FORMAT="-f 'bestvideo+bestaudio/best'"
            EXT="mp4"
          fi

          # التحميل مع أوامر تجاوز الحماية (التمويه كمتصفح حقيقي)
          yt-dlp $FORMAT \
          --no-check-certificates \
          --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
          --add-header "Accept:text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
          --add-header "Accept-Language:en-us,en;q=0.5" \
          --no-playlist \
          -o "downloads/file.$EXT" "$URL"
          
          echo "FILE_EXT=$EXT" >> $GITHUB_ENV

      - name: Upload to GoFile (Reliable Link)
        run: |
          # نستخدم GoFile لأنه أسرع ويدعم أحجام ضخمة
          RESPONSE=$(curl -F "file=@downloads/file.${{ env.FILE_EXT }}" https://store1.gofile.io/uploadFile)
          DOWNLOAD_PAGE=$(echo $RESPONSE | jq -r '.data.downloadPage')
          echo "FINAL_LINK=$DOWNLOAD_PAGE" >> $GITHUB_ENV

      - name: Final Send to Telegram
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d "text=📥 تم تجهيز الرابط يا عوض!%0A%0A🚀 رابط التحميل المباشر:%0A${{ env.FINAL_LINK }}%0A%0A⚠️ الرابط متاح لمدة 24 ساعة فقط."
