name: Video Downloader Pro (Quality Select)

on:
  repository_dispatch:
    types: [download-command]

jobs:
  download_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq
          pip install -U yt-dlp

      - name: Download Video
        run: |
          mkdir -p downloads
          URL="${{ github.event.client_payload.url }}"
          QUALITY="${{ github.event.client_payload.quality }}"
          
          # فحص الجودة المطلوبة من الإضافة
          if [ "$QUALITY" == "mp3" ]; then
            # تحميل صوت فقط
            yt-dlp "$URL" -x --audio-format mp3 -o "downloads/file.mp3"
            echo "FILE_EXT=mp3" >> $GITHUB_ENV
          elif [ "$QUALITY" == "720" ]; then
            # تحميل جودة 720p
            yt-dlp "$URL" -f "bestvideo[height<=720]+bestaudio/best" --merge-output-format mp4 -o "downloads/file.mp4"
            echo "FILE_EXT=mp4" >> $GITHUB_ENV
          elif [ "$QUALITY" == "480" ]; then
            # تحميل جودة 480p
            yt-dlp "$URL" -f "bestvideo[height<=480]+bestaudio/best" --merge-output-format mp4 -o "downloads/file.mp4"
            echo "FILE_EXT=mp4" >> $GITHUB_ENV
          else
            # الافتراضي: أفضل جودة فيديو متاحة (التي كانت تنجح معك)
            yt-dlp "$URL" -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" --merge-output-format mp4 -o "downloads/file.mp4"
            echo "FILE_EXT=mp4" >> $GITHUB_ENV
          fi

      - name: Upload to GoFile (Direct Link)
        id: upload
        run: |
          # رفع الملف لإنشاء رابط تحميل مباشر يتجاوز حد الـ 50 ميجا الخاص بتليجرام
          RESPONSE=$(curl -F "file=@downloads/file.${{ env.FILE_EXT }}" https://store1.gofile.io/uploadFile)
          DOWNLOAD_LINK=$(echo $RESPONSE | jq -r '.data.downloadPage')
          echo "FINAL_URL=$DOWNLOAD_LINK" >> $GITHUB_ENV

      - name: Send to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
          -d "chat_id=${CHAT_ID}" \
          -d "text=✅ تم التحميل بالجودة المطلوبة!%0A%0A🚀 رابط التحميل المباشر:%0A${{ env.FINAL_URL }}"
