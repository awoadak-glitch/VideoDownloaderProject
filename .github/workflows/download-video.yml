name: Snaptube Master Mode

on:
  repository_dispatch:
    types: [download-command]

jobs:
  download_job:
    runs-on: ubuntu-latest
    steps:
      - name: Install Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Flexible Download
        run: |
          mkdir -p downloads
          URL="${{ github.event.client_payload.url }}"
          QUALITY="${{ github.event.client_payload.quality }}"
          
          # اختيار ذكي للتنسيق لتجنب خطأ "Requested format is not available"
          if [ "$QUALITY" == "mp3" ]; then
            OPTS="-x --audio-format mp3"
          elif [ "$QUALITY" == "720" ]; then
            OPTS="-f 'bestvideo[height<=720]+bestaudio/best'"
          else
            # محاولة جلب أفضل جودة متاحة تلقائياً
            OPTS="-f 'best'"
          fi

          yt-dlp $OPTS \
          --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
          --no-check-certificates \
          -o "downloads/file.%(ext)s" "$URL"
          
          echo "EXT=$(ls downloads/ | sed 's/.*\.//')" >> $GITHUB_ENV

      - name: Cloud Upload
        run: |
          FILE_PATH=$(ls downloads/file.*)
          # استخدام GoFile بدلاً من transfer.sh لثبات أكثر
          RESPONSE=$(curl -F "file=@$FILE_PATH" https://store1.gofile.io/uploadFile)
          LINK=$(echo $RESPONSE | jq -r '.data.downloadPage')
          echo "FINAL_LINK=$LINK" >> $GITHUB_ENV

      - name: Telegram Notification
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d "text=✅ جاهز يا عوض!%0A%0A🚀 رابط التحميل المباشر:%0A${{ env.FINAL_LINK }}"
