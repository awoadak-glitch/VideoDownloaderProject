name: Video Downloader Bot

on:
  repository_dispatch:
    types: [download-command] # يتم تفعيله عند استقبال طلب من الإضافة

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install yt-dlp

      - name: Download Video
        run: |
          # هنا سيتم استقبال الرابط من الـ Payload الخاص بالطلب
          yt-dlp "${{ github.event.client_payload.url }}" -o "downloads/%(title)s.%(ext)s"

      - name: Upload Result
        uses: actions/upload-artifact@v3
        with:
          name: downloaded-video
          path: downloads/
