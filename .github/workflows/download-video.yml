name: Video Downloader Pro (Snaptube Mode)

on:
  repository_dispatch:
    types: [download-command]

jobs:
  download_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Advanced Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq
          # تثبيت نسخة خاصة ومحدثة جداً من المحرك
          pip install -U yt-dlp 

      - name: Snaptube Simulation Download
        run: |
          mkdir -p downloads
          URL="${{ github.event.client_payload.url }}"
          QUALITY="${{ github.event.client_payload.quality }}"
          
          # إعداد الجودة
          if [ "$QUALITY" == "mp3" ]; then
            FORMAT="-x --audio-format mp3"
            EXT="mp3"
          elif [ "$QUALITY" == "720" ]; then
            FORMAT="-f 'bestvideo[height<=720]+bestaudio/best'"
            EXT="mp4"
          else
            FORMAT="-f 'bestvideo+bestaudio/best'"
            EXT="mp4"
          fi

          # السر هنا: استخدام --impersonate لتزييف هوية المتصفح بالكامل
          # وإضافة ثغرة الانتظار العشوائي لتبدو كإنسان
          yt-dlp $FORMAT \
          --impersonate "chrome" \
          --sleep-requests 1 \
          --random-user-agent \
          --no-check-certificates \
          --no-playlist \
          -o "downloads/file.$EXT" "$URL"
          
          echo "FILE_EXT=$EXT" >> $GITHUB_ENV

      - name: Direct Cloud Upload
        run: |
          # استخدام GoFile لضمان عدم وجود قيود حجم (مثل سنابتوب)
          RESPONSE=$(curl -F "file=@downloads/file.${{ env.FILE_EXT }}" https://store1.gofile.io/uploadFile)
          DOWNLOAD_URL=$(echo $RESPONSE | jq -r '.data.downloadPage')
          echo "FINAL_URL=$DOWNLOAD_URL" >> $GITHUB_ENV

      - name: Notify Awadh via Telegram
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d "text=🚀 تم التحميل بنظام سنابتوب!%0A%0A📦 طلبك جاهز يا عوض:%0A${{ env.FINAL_URL }}%0A%0A⚠️ ملاحظة: هذا الرابط يتجاوز حظر تليجرام."
