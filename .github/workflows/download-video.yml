name: Video Downloader Ultimate (Quality Select)

on:
  repository_dispatch:
    types: [download-command]

jobs:
  download_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq
          pip install -U yt-dlp

      - name: Download Processing
        run: |
          mkdir -p downloads
          URL="${{ github.event.client_payload.url }}"
          QUALITY="${{ github.event.client_payload.quality }}"
          
          # إعداد خيارات الجودة بناءً على طلبك
          if [ "$QUALITY" == "mp3" ]; then
            FORMAT="-x --audio-format mp3"
            EXT="mp3"
          elif [ "$QUALITY" == "720" ]; then
            FORMAT="-f 'bestvideo[height<=720]+bestaudio/best'"
            EXT="mp4"
          else
            # أفضل جودة (التي نجحت معك في الصورة 3)
            FORMAT="-f 'bestvideo+bestaudio/best'"
            EXT="mp4"
          fi

          # التحميل مع تمويه كامل لتجنب "Unable to extract title"
          yt-dlp $FORMAT \
          --no-check-certificates \
          --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
          --referer "https://www.google.com/" \
          --no-playlist \
          -o "downloads/file.$EXT" "$URL"
          
          echo "FILE_EXT=$EXT" >> $GITHUB_ENV

      - name: Upload to GoFile (Overcoming 50MB Limit)
        run: |
          # الرفع لـ GoFile للحصول على رابط مباشر يتجاوز حد تليجرام
          RESPONSE=$(curl -F "file=@downloads/file.${{ env.FILE_EXT }}" https://store1.gofile.io/uploadFile)
          # استخراج رابط التحميل
          DOWNLOAD_URL=$(echo $RESPONSE | jq -r '.data.downloadPage')
          echo "FINAL_URL=$DOWNLOAD_URL" >> $GITHUB_ENV

      - name: Send Direct Link to Telegram
        run: |
          # إرسال الرابط النهائي لك
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d "text=✅ تم التحميل بنجاح يا عوض!%0A%0A📦 حجم الملف كبير (تجاوز 50MB)%0A🚀 حمله مباشرة من هذا الرابط:%0A${{ env.FINAL_URL }}"
