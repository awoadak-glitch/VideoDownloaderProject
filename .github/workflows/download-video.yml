name: Cloud Video Downloader (Direct Link)
on:
  repository_dispatch:
    types: [download-command]

jobs:
  download_and_send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq
          pip install -U yt-dlp  # تحديث لضمان تجاوز حماية يوتيوب

      - name: Download Video (Custom Quality)
        run: |
          mkdir -p downloads
          URL="${{ github.event.client_payload.url }}"
          QUALITY="${{ github.event.client_payload.quality }}"
          
          # اختيار الجودة بناءً على طلبك من الإضافة
          if [ "$QUALITY" == "mp3" ]; then
            yt-dlp "$URL" -x --audio-format mp3 -o "downloads/file.mp3"
            echo "FILE_NAME=file.mp3" >> $GITHUB_ENV
          elif [ "$QUALITY" == "720" ]; then
            yt-dlp "$URL" -f "bestvideo[height<=720]+bestaudio/best" --merge-output-format mp4 -o "downloads/file.mp4"
            echo "FILE_NAME=file.mp4" >> $GITHUB_ENV
          elif [ "$QUALITY" == "480" ]; then
            yt-dlp "$URL" -f "bestvideo[height<=480]+bestaudio/best" --merge-output-format mp4 -o "downloads/file.mp4"
            echo "FILE_NAME=file.mp4" >> $GITHUB_ENV
          else
            yt-dlp "$URL" -f "bestvideo+bestaudio/best" --merge-output-format mp4 -o "downloads/file.mp4"
            echo "FILE_NAME=file.mp4" >> $GITHUB_ENV
          fi

      - name: Generate Direct Link
        id: upload
        run: |
          # رفع الملف لخدمة transfer.sh للحصول على رابط مباشر يتجاوز 50 ميجا
          LINK=$(curl --upload-file downloads/${{ env.FILE_NAME }} https://transfer.sh/${{ env.FILE_NAME }})
          echo "DIRECT_URL=$LINK" >> $GITHUB_ENV

      - name: Send Link to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
          -d "chat_id=${CHAT_ID}" \
          -d "text=✅ تم تجهيز طلبك يا عوض!%0A%0A🚀 رابط التحميل المباشر (صالح لـ 24 ساعة):%0A${{ env.DIRECT_URL }}"
