name: Video Downloader Pro (No Cookies Edition)

on:
  repository_dispatch:
    types: [download-command]

jobs:
  download_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq
          # تثبيت المحرك مع مشغل جافا سكريبت خفيف لتجاوز حماية المواقع
          pip install -U yt-dlp 

      - name: Download Video
        run: |
          mkdir -p downloads
          URL="${{ github.event.client_payload.url }}"
          QUALITY="${{ github.event.client_payload.quality }}"
          
          # تحديد الجودة المطلوبة
          if [ "$QUALITY" == "mp3" ]; then
            FORMAT="-x --audio-format mp3"
            EXT="mp3"
          elif [ "$QUALITY" == "720" ]; then
            FORMAT="-f 'bestvideo[height<=720]+bestaudio/best'"
            EXT="mp4"
          else
            FORMAT="-f 'bestvideo+bestaudio/best'"
            EXT="mp4"
          fi

          # التحميل باستخدام تقنية "التخفي" بدون كوكيز
          yt-dlp $FORMAT \
          --no-check-certificates \
          --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
          --referer "https://www.google.com/" \
          --geo-bypass \
          --no-playlist \
          -o "downloads/file.$EXT" "$URL"
          
          echo "FILE_EXT=$EXT" >> $GITHUB_ENV

      - name: Upload to GoFile (Direct Link)
        run: |
          # الرفع لخدمة خارجية لتجاوز حد الـ 50 ميجا في تليجرام
          RESPONSE=$(curl -F "file=@downloads/file.${{ env.FILE_EXT }}" https://store1.gofile.io/uploadFile)
          DOWNLOAD_PAGE=$(echo $RESPONSE | jq -r '.data.downloadPage')
          echo "FINAL_LINK=$DOWNLOAD_PAGE" >> $GITHUB_ENV

      - name: Send to Telegram
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d "text=📥 تم التحميل بنجاح يا عوض!%0A%0A🚀 رابط التحميل المباشر:%0A${{ env.FINAL_LINK }}%0A%0A⚠️ الرابط يتجاوز قيود تليجرام وسيعمل معك مباشرة."
