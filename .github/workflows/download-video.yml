name: Snaptube Direct Engine

on:
  repository_dispatch:
    types: [download-command]

jobs:
  download_job:
    runs-on: ubuntu-latest
    steps:
      - name: Setup
        run: sudo apt-get update && sudo apt-get install -y ffmpeg jq curl

      - name: Direct Download (Snaptube Mode)
        run: |
          mkdir -p downloads
          # هنا الرابط القادم من المتصفح يكون رابطاً مباشراً وجاهزاً
          DIRECT_URL="${{ github.event.client_payload.url }}"
          
          # التحميل المباشر بدون محرك التحليل الثقيل
          curl -L "$DIRECT_URL" -o "downloads/video.mp4" || wget "$DIRECT_URL" -O "downloads/video.mp4"
          
      - name: High Speed Upload
        run: |
          # الرفع إلى GoFile لتجاوز حجم تليجرام (حتى 2 جيجا)
          RESPONSE=$(curl -F "file=@downloads/video.mp4" https://store1.gofile.io/uploadFile)
          FINAL_LINK=$(echo $RESPONSE | jq -r '.data.downloadPage')
          echo "FINAL_LINK=$FINAL_LINK" >> $GITHUB_ENV

      - name: Final Notification
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d "text=🎯 تم اصطياد الفيديو يا عوض!%0A%0A📦 الرابط المباشر:%0A${{ env.FINAL_LINK }}"
