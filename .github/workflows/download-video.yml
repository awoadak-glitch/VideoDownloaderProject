name: Snaptube Direct Downloader

on:
  repository_dispatch:
    types: [download-command]

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Install Tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg jq curl

      - name: Direct File Download
        run: |
          mkdir -p downloads
          # تحميل الملف مباشرة من الرابط المصطاد
          URL="${{ github.event.client_payload.url }}"
          
          # استخدام yt-dlp فقط كمحرك سحب سريع لضمان الجودة
          yt-dlp -f "best" --no-check-certificates "$URL" -o "downloads/video.mp4"

      - name: Cloud Upload (GoFile)
        run: |
          # الرفع لـ GoFile لتجاوز حجم الـ 50MB في تليجرام
          RESPONSE=$(curl -F "file=@downloads/video.mp4" https://store1.gofile.io/uploadFile)
          LINK=$(echo $RESPONSE | jq -r '.data.downloadPage')
          echo "FINAL_LINK=$LINK" >> $GITHUB_ENV

      - name: Send Link to Awadh
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d "text=🎯 تم الاصطياد بنجاح!%0A%0A📦 الرابط المباشر:%0A${{ env.FINAL_LINK }}"
