name: Build AWR VPN Ultra

on:
  push:
    branches: [ awr-vpn-ultra ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Reassemble UI sources
        run: |
          mkdir -p AWRVPN/app/src/main/java/com/awr/vpn
          cat AWRVPN/source_parts/MainActivity.kt.part* > AWRVPN/app/src/main/java/com/awr/vpn/MainActivity.kt
          cat AWRVPN/source_parts/AwrVpnSurface.kt.part* > AWRVPN/app/src/main/java/com/awr/vpn/AwrVpnSurface.kt
      - name: Build AWR VPN Ultra
        working-directory: AWRVPN
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AWR-VPN-ULTRA-debug
          path: AWRVPN/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
