name: Build AWR VPN Ultra

on:
  push:
    branches: [ main, awr-vpn-ultra ]
    paths:
      - 'AWRVPN/**'
      - '.github/workflows/build-awr-vpn-ultra.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Apply AWR VPN Ultra 2 sources
        run: |
          cat AWRVPN/ultra2_bundle.part* | base64 -d > /tmp/awr-ultra2.tar.gz
          tar -xzf /tmp/awr-ultra2.tar.gz -C AWRVPN
          test -f AWRVPN/app/src/main/java/com/awr/vpn/MainActivity.kt
          test -f AWRVPN/app/src/main/java/com/awr/vpn/ConnectionControl.kt
          test -f AWRVPN/app/src/main/java/com/awr/vpn/SmartRouter.kt
      - name: Build AWR VPN Ultra 2
        working-directory: AWRVPN
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AWR-VPN-ULTRA-2-debug
          path: AWRVPN/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
