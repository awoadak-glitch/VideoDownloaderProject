name: Build AWR VPN Ultra

on:
  push:
    branches: [ main, awr-vpn-ultra ]
    paths:
      - 'AWRVPN/**'
      - '.github/workflows/build-awr-vpn-ultra.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify and finalize AWR VPN Ultra 2 sources
        run: |
          test -f AWRVPN/app/src/main/java/com/awr/vpn/UltraMainActivity.kt
          test -f AWRVPN/app/src/main/java/com/awr/vpn/UltraSurface.kt
          test -f AWRVPN/app/src/main/java/com/awr/vpn/UltraState.kt
          test -f AWRVPN/app/src/main/java/com/awr/vpn/ModelsNetwork.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('AWRVPN/app/src/main/java/com/awr/vpn/UltraMainActivity.kt')
          s = p.read_text()
          old = 'override fun updateState(state: String?, logmessage: String?, localizedResId: Int, level: ConnectionStatus?) {'
          new = 'override fun updateState(state: String?, logmessage: String?, localizedResId: Int, level: ConnectionStatus?, intent: Intent?) {'
          if old in s:
              s = s.replace(old, new)
          if new not in s:
              raise SystemExit('StateListener signature not found')
          p.write_text(s)
          PY
      - name: Build AWR VPN Ultra 2
        working-directory: AWRVPN
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AWR-VPN-ULTRA-2-debug
          path: AWRVPN/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
