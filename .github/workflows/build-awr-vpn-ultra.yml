name: Build AWR VPN Ultra

on:
  push:
    branches: [ main, awr-vpn-ultra ]
    paths:
      - 'AWRVPN/**'
      - '.github/workflows/build-awr-vpn-ultra.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install native VPN toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y swig ninja-build
          yes | sdkmanager "cmake;3.22.1" "ndk;27.3.13750724" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          validate-wrappers: false
      - name: Reassemble UI sources
        run: |
          mkdir -p AWRVPN/app/src/main/java/com/awr/vpn
          cat AWRVPN/source_parts/MainActivity.kt.part* > AWRVPN/app/src/main/java/com/awr/vpn/MainActivity.kt
          cat AWRVPN/source_parts/AwrVpnSurface.kt.part* > AWRVPN/app/src/main/java/com/awr/vpn/AwrVpnSurface.kt
      - name: Build AWR VPN Ultra
        working-directory: AWRVPN
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AWR-VPN-ULTRA-debug
          path: AWRVPN/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
